name: swift-api-check

# DEBUG-ONLY: pre-flight gate before asking Osama for a Codemagic build.
# Fetches the EXACT Swift files from origin/debug-fairplay-logviewer (the
# build branch) and typechecks them against the iOS SDK with the newest
# Xcode — the same compile Codemagic performs. Also probes the AVFoundation
# headers to explain any discrepancy between macOS-SDK and iOS-SDK APIs
# (persistable content keys are iOS/tvOS-only APIs).
# Push to fairplay-harness to iterate.

on:
  push:
    branches: [fairplay-harness]
  workflow_dispatch:

jobs:
  avck-signature:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Select the newest Xcode (match Codemagic's SDK generation)
        run: |
          NEWEST=$(ls -d /Applications/Xcode*.app 2>/dev/null | grep -v "beta\|Beta" | sort -V | tail -1)
          if [ -z "$NEWEST" ]; then
            NEWEST=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          fi
          echo "Using: $NEWEST"
          sudo xcode-select -s "$NEWEST"
          swiftc --version

      - name: Probe AVFoundation headers (macOS vs iOS SDK)
        run: |
          echo "=== macOS SDK AVContentKeyRequest.h ==="
          grep -n "PersistableContentKeyRequest" "$(xcrun --sdk macosx --show-sdk-path)/System/Library/Frameworks/AVFoundation.framework/Headers/AVContentKeyRequest.h" 2>/dev/null || echo "NOT FOUND in macOS SDK header"
          echo "=== iOS SDK AVContentKeyRequest.h ==="
          grep -n "PersistableContentKeyRequest" "$(xcrun --sdk iphoneos --show-sdk-path)/System/Library/Frameworks/AVFoundation.framework/Headers/AVContentKeyRequest.h" 2>/dev/null || echo "NOT FOUND in iOS SDK header"

      - name: Typecheck the real delegate files against the iOS SDK (Codemagic-equivalent)
        run: |
          set -e
          git fetch origin debug-fairplay-logviewer
          mkdir -p /tmp/fpcheck
          git show origin/debug-fairplay-logviewer:vendor/better_player_plus/ios/Classes/FairplayContentKeyDelegate.swift > /tmp/fpcheck/FairplayContentKeyDelegate.swift
          git show origin/debug-fairplay-logviewer:vendor/better_player_plus/ios/Classes/FairplayDiagnostics.swift > /tmp/fpcheck/FairplayDiagnostics.swift
          echo "=== swiftc -typecheck vs iOS SDK (arm64-apple-ios15.0) ==="
          swiftc -typecheck \
            -sdk "$(xcrun --sdk iphoneos --show-sdk-path)" \
            -target arm64-apple-ios15.0 \
            /tmp/fpcheck/FairplayContentKeyDelegate.swift \
            /tmp/fpcheck/FairplayDiagnostics.swift
          echo "=== TYPECHECK PASSED (iOS SDK) — safe to ask Osama for a Codemagic build ==="

      - name: Typecheck the AVAudioPlayer probe (parallel-audio sink APIs)
        run: |
          set -e
          echo "=== swiftc -typecheck harness/avaudioplayer_probe.swift (iOS SDK) ==="
          swiftc -typecheck \\
            -sdk \"\\" \\
            -target arm64-apple-ios15.0 \\
            harness/avaudioplayer_probe.swift
          echo \"=== AVAUDIOPLAYER PROBE PASSED ===\"
